<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D365 Helper – Toolkit für Dynamics 365 F&amp;O und SCM</title>
  <meta name="description" content="Kostenlose Browser-Erweiterung für Chrome und Edge: Tabellenbrowser, Umgebungs- und Company-Wechsel, OData-Abfragen, Favoriten und Verlauf für Dynamics 365 Finance & Operations und Supply Chain Management.">
  <meta property="og:title" content="D365 Helper – Toolkit für Dynamics 365 F&amp;O und SCM">
  <meta property="og:description" content="Kostenlose Browser-Erweiterung für Chrome und Edge. Alle Daten bleiben im Browser.">
  <meta property="og:image" content="https://r-steffen.github.io/d365-helper-privacy/start/img/tabellen.jpg">
  <meta property="og:type" content="website">
  <link rel="icon" href="../icon128.png">
  <!--
    Startseite für Empfehlungen und Posts. ?go leitet sofort in den Store des aktuellen Browsers
    weiter (Link der Funktion „Empfehlen“ in der Erweiterung). Sprache folgt dem Browser, ?lang=en|de erzwingt.
  -->
  <script>
    const STORE = {
      chrome: 'https://chromewebstore.google.com/detail/lfikmhldcnligddbfacjjdncacalmkab',
      edge:   'https://microsoftedge.microsoft.com/addons/detail/bnhfgedgaihklmgdddngljapbmbghhpo',
    };
    const BROWSER = /Edg\//.test(navigator.userAgent) ? 'edge'
                  : /Chrome\//.test(navigator.userAgent) && !/OPR\/|Firefox/.test(navigator.userAgent) ? 'chrome' : '';
    if (new URLSearchParams(location.search).has('go') && BROWSER) location.replace(STORE[BROWSER]);
  </script>
  <style>
    :root { --blue: #1e40af; --primary: #2563eb; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --bg: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.6 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg); }
    a { color: var(--blue); }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }

    .hero { background: linear-gradient(135deg, #1e3a9f, #2563eb); color: #fff; padding: 22px 0 56px; }
    .topbar { display: flex; align-items: center; gap: 12px; }
    .topbar img { width: 36px; height: 36px; }
    .topbar strong { font-size: 18px; }
    .topbar .spacer { flex: 1; }
    .lang { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 6px;
            padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
    .hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 40px; align-items: center; margin-top: 40px; }
    .hero h1 { font-size: 40px; line-height: 1.15; margin: 0 0 14px; letter-spacing: -.5px; }
    .hero p.lead { font-size: 18px; opacity: .9; margin: 0 0 26px; }
    .cta { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 8px; font-weight: 600;
           text-decoration: none; font-size: 15px; border: 2px solid transparent; }
    .btn-primary { background: #fff; color: var(--blue); }
    .btn-secondary { border-color: rgba(255,255,255,.6); color: #fff; }
    .btn:hover { filter: brightness(.95); }
    .hint { font-size: 13px; opacity: .8; margin-top: 12px; }
    .hero-grid > *, .shots > *, .features > * { min-width: 0; }
    .hero-shot { border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.35); width: 100%; display: block; }

    .badges { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; margin: -26px auto 0; position: relative; }
    .badge { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px;
             box-shadow: 0 4px 14px rgba(15,23,42,.06); font-size: 14px; font-weight: 600; }

    h2 { font-size: 28px; text-align: center; margin: 64px 0 8px; }
    p.sub { text-align: center; color: var(--muted); margin: 0 0 32px; }
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .feature { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
    .feature .icon { font-size: 26px; }
    .feature h3 { margin: 6px 0 4px; font-size: 17px; }
    .feature p { margin: 0; color: var(--muted); font-size: 14.5px; }

    .shots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    .shots img { width: 100%; border-radius: 10px; border: 1px solid var(--border); display: block; cursor: zoom-in; }

    .privacy { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 24px 28px; margin-top: 56px;
               display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
    .privacy .icon { font-size: 40px; }
    .privacy h3 { margin: 0 0 4px; }
    .privacy p { margin: 0; color: var(--muted); }

    .final { text-align: center; margin: 56px 0 0; }
    .final .cta { justify-content: center; }
    .final .btn-primary { background: var(--primary); color: #fff; }
    .final .btn-secondary { border-color: var(--primary); color: var(--primary); }

    footer { margin-top: 64px; padding: 24px 0 40px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13.5px; }
    footer .wrap { display: flex; gap: 18px; flex-wrap: wrap; }

    dialog { border: none; padding: 0; max-width: 92vw; background: transparent; }
    dialog img { max-width: 92vw; max-height: 90vh; border-radius: 10px; display: block; }
    dialog::backdrop { background: rgba(15,23,42,.8); }

    @media (max-width: 860px) {
      .hero-grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 32px; }
      .features { grid-template-columns: 1fr 1fr; }
      .shots { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .features { grid-template-columns: 1fr; }
      .privacy { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="topbar">
        <img src="../icon128.png" alt="">
        <strong>D365 Helper</strong>
        <span class="spacer"></span>
        <button class="lang" id="lang-toggle" type="button">English</button>
      </div>
      <div class="hero-grid">
        <div>
          <h1 data-t="heroTitle"></h1>
          <p class="lead" data-t="heroLead"></p>
          <div class="cta" id="cta-top"></div>
          <p class="hint" data-t="heroHint"></p>
        </div>
        <img class="hero-shot" src="img/tabellen.jpg" alt="" data-zoom>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="badges">
      <span class="badge" data-t="badgeFree"></span>
      <span class="badge" data-t="badgeBrowsers"></span>
      <span class="badge" data-t="badgePrivacy"></span>
      <span class="badge" data-t="badgeLang"></span>
    </div>

    <h2 data-t="featuresTitle"></h2>
    <p class="sub" data-t="featuresSub"></p>
    <div class="features" id="features"></div>

    <h2 data-t="shotsTitle"></h2>
    <p class="sub" data-t="shotsSub"></p>
    <div class="shots">
      <img src="img/odata.jpg" alt="" data-zoom>
      <img src="img/url.jpg" alt="" data-zoom>
      <img src="img/favoriten.jpg" alt="" data-zoom>
      <img src="img/einfuehrung.jpg" alt="" data-zoom>
    </div>

    <div class="privacy">
      <div class="icon">🔒</div>
      <div>
        <h3 data-t="privacyTitle"></h3>
        <p data-t="privacyText"></p>
      </div>
    </div>

    <div class="final">
      <h2 data-t="finalTitle" style="margin-top:0"></h2>
      <div class="cta" id="cta-bottom"></div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <a href="../" data-t="footerPrivacy"></a>
      <span data-t="footerContact"></span>
      <span data-t="footerDisclaimer"></span>
    </div>
  </footer>

  <dialog id="zoom"><img alt=""></dialog>

  <script>
    const TEXT = {
      de: {
        title: 'D365 Helper – Toolkit für Dynamics 365 F&O und SCM',
        heroTitle: 'Schneller arbeiten in Dynamics 365 F&O und SCM',
        heroLead: 'Eine kostenlose Seitenleiste für Chrome und Edge, die neben D365 geöffnet bleibt: Tabellen öffnen, zwischen Umgebungen und Companies wechseln, Daten per OData abfragen – ohne URLs von Hand zu bearbeiten.',
        heroHint: 'Für Berater, Key User und Entwickler.',
        install: 'Kostenlos für {b} installieren', alsoFor: 'Auch für {b}',
        otherBrowser: 'Läuft in Google Chrome und Microsoft Edge.',
        badgeFree: '✔ Kostenlos', badgeBrowsers: '✔ Chrome & Edge', badgePrivacy: '✔ Keine Datenweitergabe', badgeLang: '✔ Deutsch & Englisch',
        featuresTitle: 'Alles für den D365-Alltag', featuresSub: 'Direkt neben D365, ohne Popup und ohne Umwege.',
        shotsTitle: 'So sieht es aus', shotsSub: 'Zum Vergrößern auf ein Bild klicken.',
        privacyTitle: 'Alle Daten bleiben im Browser',
        privacyText: 'Keine Server, kein Konto, kein Tracking. OData-Abfragen laufen mit der eigenen D365-Anmeldung direkt gegen die eigene Umgebung.',
        finalTitle: 'Jetzt ausprobieren',
        footerPrivacy: 'Datenschutzerklärung', footerContact: 'Kontakt: d365helper@outlook.de',
        footerDisclaimer: 'Unabhängiges Werkzeug, keine Verbindung zu Microsoft. Dynamics 365 ist eine Marke der Microsoft Corporation.',
        toggle: 'English',
        features: [
          ['🗂️', 'Tabellenbrowser', 'Rund 6.000 Standardtabellen durchsuchen, ein Klick öffnet den SysTableBrowser – auch für eigene Tabellen.'],
          ['🚦', 'Umgebungen mit Farbe', 'DEV, TEST, SAT und PROD je Kunde oder Projekt. Ein farbiges Band in D365 zeigt immer, wo man gerade ist.'],
          ['🔀', 'Company & Umgebung wechseln', 'Dieselbe Seite mit einem Klick in einer anderen Company oder Umgebung öffnen.'],
          ['📊', 'OData-Abfragen', 'Entität, Felder und Filter auswählen – ohne URL-Syntax. Ergebnis als Excel, CSV oder JSON.'],
          ['⭐', 'Favoriten & Verlauf', 'Menüpunkte samt Parametern merken, die letzten Seiten wiederfinden, alles mit Strg+K durchsuchen.'],
          ['🧭', 'Direkt in D365', 'Buttons in der Navigationsleiste, Erkennung der aktuellen Seite, URL-Snippets und Klassen-Runner.'],
        ],
      },
      en: {
        title: 'D365 Helper – Toolkit for Dynamics 365 F&O and SCM',
        heroTitle: 'Work faster in Dynamics 365 F&O and SCM',
        heroLead: 'A free side panel for Chrome and Edge that stays open next to D365: open tables, switch environments and companies, query data via OData – without editing URLs by hand.',
        heroHint: 'For consultants, key users and developers.',
        install: 'Add to {b} – it’s free', alsoFor: 'Also for {b}',
        otherBrowser: 'Works in Google Chrome and Microsoft Edge.',
        badgeFree: '✔ Free', badgeBrowsers: '✔ Chrome & Edge', badgePrivacy: '✔ No data sharing', badgeLang: '✔ English & German',
        featuresTitle: 'Everything for daily D365 work', featuresSub: 'Right next to D365 – no popup, no detours.',
        shotsTitle: 'See it in action', shotsSub: 'Click an image to enlarge it.',
        privacyTitle: 'All data stays in your browser',
        privacyText: 'No servers, no account, no tracking. OData queries run with your own D365 sign-in directly against your own environment.',
        finalTitle: 'Try it now',
        footerPrivacy: 'Privacy policy', footerContact: 'Contact: d365helper@outlook.de',
        footerDisclaimer: 'Independent tool, not affiliated with Microsoft. Dynamics 365 is a trademark of Microsoft Corporation.',
        toggle: 'Deutsch',
        features: [
          ['🗂️', 'Table browser', 'Search about 6,000 standard tables, one click opens SysTableBrowser – your own tables too.'],
          ['🚦', 'Color-coded environments', 'DEV, TEST, SAT and PROD per customer or project. A colored band in D365 always shows where you are.'],
          ['🔀', 'Switch company & environment', 'Open the same page in another company or environment with one click.'],
          ['📊', 'OData queries', 'Pick an entity, fields and filters – no URL syntax. Export to Excel, CSV or JSON.'],
          ['⭐', 'Favorites & history', 'Save menu items with parameters, find recent pages again, search everything with Ctrl+K.'],
          ['🧭', 'Right inside D365', 'Buttons in the navigation bar, page detection, URL snippets and class runner.'],
        ],
      },
    };
    const NAMES = { chrome: 'Chrome', edge: 'Edge' };

    function render(lang) {
      const t = TEXT[lang];
      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
      document.getElementById('lang-toggle').textContent = t.toggle;

      // Passender Store zuerst; unbekannter Browser (Firefox, Safari …): beide gleichwertig
      const order = BROWSER === 'edge' ? ['edge', 'chrome'] : ['chrome', 'edge'];
      ['cta-top', 'cta-bottom'].forEach(id => {
        const box = document.getElementById(id);
        box.innerHTML = '';
        order.forEach((b, i) => {
          const a = document.createElement('a');
          a.href = STORE[b];
          a.className = 'btn ' + (i === 0 || !BROWSER ? 'btn-primary' : 'btn-secondary');
          a.textContent = (i === 0 || !BROWSER ? t.install : t.alsoFor).replace('{b}', NAMES[b]);
          box.appendChild(a);
        });
      });
      if (!BROWSER) document.querySelector('.hint').textContent = t.otherBrowser;

      const features = document.getElementById('features');
      features.innerHTML = '';
      t.features.forEach(([icon, title, text]) => {
        const div = document.createElement('div');
        div.className = 'feature';
        div.innerHTML = '<div class="icon"></div><h3></h3><p></p>';
        div.querySelector('.icon').textContent = icon;
        div.querySelector('h3').textContent = title;
        div.querySelector('p').textContent = text;
        features.appendChild(div);
      });
    }

    let lang = new URLSearchParams(location.search).get('lang') ||
               ((navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en');
    if (!TEXT[lang]) lang = 'en';
    render(lang);
    document.getElementById('lang-toggle').addEventListener('click', () => render(lang = lang === 'de' ? 'en' : 'de'));

    // Bilder vergrößern
    const zoom = document.getElementById('zoom');
    document.querySelectorAll('[data-zoom]').forEach(img => img.addEventListener('click', () => {
      zoom.querySelector('img').src = img.src;
      zoom.showModal();
    }));
    zoom.addEventListener('click', () => zoom.close());
  </script>
</body>
</html>
