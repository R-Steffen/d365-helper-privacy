<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D365 Helper – Geteilter Eintrag</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../icon128.png">
<style>
  :root { --blue: #1e40af; --primary: #2563eb; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --bg: #f8fafc; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.6 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg); }
  .wrap { max-width: 560px; margin: 60px auto; padding: 0 20px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 28px 30px; box-shadow: 0 4px 20px rgba(15,23,42,.06); }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .logo img { width: 30px; height: 30px; }
  .logo strong { font-size: 16px; }
  h1 { font-size: 21px; margin: 0 0 6px; }
  .type-badge { display: inline-block; background: #eef2ff; color: var(--blue); border-radius: 6px; padding: 2px 9px; font-size: 12.5px; font-weight: 600; margin-bottom: 10px; }
  dl { margin: 14px 0 0; }
  dl div { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 14.5px; }
  dl dt { color: var(--muted); min-width: 110px; flex-shrink: 0; }
  dl dd { margin: 0; word-break: break-all; }
  .actions { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  .btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 8px;
         font-weight: 600; text-decoration: none; font-size: 15px; border: 2px solid var(--primary); cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: none; color: var(--primary); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 14px; text-align: center; }
  .error, .empty { color: var(--muted); }
  footer { max-width: 560px; margin: 24px auto; padding: 0 20px; color: var(--muted); font-size: 13px; text-align: center; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="logo"><img src="../icon128.png" alt=""><strong>D365 Helper</strong></div>
      <div id="content">Lädt …</div>
    </div>
  </div>
  <footer>
    Dieser Link enthält die geteilten Daten direkt im Adressfragment (nach #) – nichts davon
    wird an einen Server geschickt. <a href="../">Zur Startseite</a>
  </footer>

<script>
'use strict';

// Eigenständige Kopie der Kodierung aus shared/share.js (anderes, öffentliches Repo,
// daher kein gemeinsamer Build/Import – bei Änderungen am Schema beide Stellen pflegen).
const SHARE_VERSION = 1;
function decodeSharePayload(hash) {
  try {
    const clean = String(hash || '').replace(/^#/, '');
    if (!clean) return null;
    const json = decodeURIComponent(escape(atob(clean)));
    const payload = JSON.parse(json);
    if (payload?.v === SHARE_VERSION && payload.type && payload.data) return payload;
  } catch (e) {}
  return null;
}

const EXTENSION_IDS = [
  'lfikmhldcnligddbfacjjdncacalmkab',   // Chrome Web Store
  'bnhfgedgaihklmgdddngljapbmbghhpo',   // Edge Add-ons
];

const TYPE_LABEL = { favorite: 'Favorit', class: 'Klasse', snippet: 'URL-Snippet', table: 'Tabelle' };
const FIELD_LABEL = {
  label: 'Name', name: 'Name', desc: 'Beschreibung', gruppe: 'Gruppe',
  mi: 'Menüpunkt', params: 'Parameter', entity: 'Entität',
};
const FIELD_ORDER = ['label', 'name', 'desc', 'mi', 'entity', 'params', 'gruppe'];

function sendToExtension(payload) {
  if (!window.chrome?.runtime?.sendMessage) return Promise.resolve(false);
  const tries = EXTENSION_IDS.map(id => new Promise(resolve => {
    try {
      chrome.runtime.sendMessage(id, { type: 'd365helperShare', payload }, resp => {
        void chrome.runtime.lastError;   // Antwort einer nicht installierten Erweiterung nur abfangen
        resolve(!!resp?.ok);
      });
    } catch (e) { resolve(false); }
  }));
  return Promise.all(tries).then(results => results.some(Boolean));
}

function render() {
  const content = document.getElementById('content');
  const payload = decodeSharePayload(location.hash);
  if (!payload || !TYPE_LABEL[payload.type]) {
    content.innerHTML = '<p class="empty">Kein gültiger D365-Helper-Link gefunden. '
      + 'Öffne diese Seite über einen „Teilen“-Link aus der Erweiterung.</p>';
    return;
  }

  const rows = FIELD_ORDER
    .filter(k => payload.data[k])
    .map(k => `<div><dt>${FIELD_LABEL[k]}</dt><dd>${escapeHtml(String(payload.data[k]))}</dd></div>`)
    .join('');

  content.innerHTML = `
    <span class="type-badge">${TYPE_LABEL[payload.type]}</span>
    <h1>${escapeHtml(payload.data.label || payload.data.name || '')}</h1>
    <dl>${rows}</dl>
    <div class="actions">
      <button id="open-btn" class="btn btn-primary">In D365 Helper öffnen</button>
      <a id="store-link" class="btn btn-secondary" href="../?go=1">D365 Helper installieren</a>
    </div>
    <p class="hint" id="hint">Noch nicht installiert? Erst installieren, dann diese Seite neu laden.</p>
  `;

  document.getElementById('open-btn').addEventListener('click', async () => {
    const btn = document.getElementById('open-btn');
    btn.textContent = 'Wird gesendet …';
    const ok = await sendToExtension(payload);
    if (ok) {
      btn.textContent = '✓ Gesendet – jetzt das D365-Helper-Icon anklicken';
      document.getElementById('hint').textContent =
        'Im Side Panel wartet der Eintrag zur Übernahme, sobald du das Erweiterungs-Icon anklickst.';
    } else {
      btn.textContent = 'In D365 Helper öffnen';
      document.getElementById('hint').textContent =
        'Keine Antwort von der Erweiterung – ist sie installiert und aktiv? Sonst erst installieren und die Seite neu laden.';
    }
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

render();
</script>
</body>
</html>
